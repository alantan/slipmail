name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
      - run: deno task lint
      - run: deno task check
      - run: deno task test
      - name: Build and run the security check
        run: |
          mkdir -p "$RUNNER_TEMP/slipmail"
          IMAP_HOST=imap.example.test MAILBOX_ADDRESS=me@example.test SCRATCH_DIR="$RUNNER_TEMP/slipmail" deno task build
          deno task security-check
